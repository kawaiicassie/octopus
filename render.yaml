      # - key: OCTOPUS_DATABASE_PATH
      #   value: /opt/render/project/.render/data.db

      # Option 2: PostgreSQL với Supabase Pooler (port 5432)
      - key: OCTOPUS_DATABASE_TYPE
        value: postgres
      - key: OCTOPUS_DATABASE_PATH
        value: "postgresql://postgres.psqxoyvmdtuswysnifez:Krgjami1250@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require&pool_max_conns=3"